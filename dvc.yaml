stages:
  etl:
    cmd: python -m fleetsense.workflows.etl
    deps:
      - configs/config.yaml
      - data/raw
      - src/fleetsense/etl
      - src/fleetsense/workflows/etl.py
    outs:
      - data/processed:
          persist: true
      - data/features:
          persist: true

  train:
    cmd: python -m fleetsense.workflows.train
    deps:
      - configs/model.yaml
      - data/features
      - src/fleetsense/ml
      - src/fleetsense/workflows/train.py
    outs:
      - artifacts/models:
          persist: true
    metrics:
      - artifacts/metrics.json:
          cache: false
