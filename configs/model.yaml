model:
  name: "trip_duration_regressor"
  algorithm: "XGBRegressor"
  target_column: "trip_duration_minutes"
  max_duration_minutes: 180.0
  features:
    - VendorID
    - passenger_count
    - trip_distance
    - PULocationID
    - DOLocationID
    - pickup_hour
    - pickup_day_of_week
    - pickup_month
    - pickup_day
    - is_weekend
    - pickup_hour_sin
    - pickup_hour_cos
    - is_rush_hour
    - PU_DO_pair
  categorical_features:
    - VendorID
    - PULocationID
    - DOLocationID
    - PU_DO_pair
  random_state: 42
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 6
  subsample_size: 2000000
  max_history_months: 12
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  mlflow_tracking_uri: "sqlite:///mlflow.db"
  mlflow_experiment_name: "fleetsense-trip-duration"

  # ---------------------------------------------------------------------------
  # Model Quality Gate thresholds
  # A retrain is rejected (Prefect run fails) if validation metrics fall
  # outside these bounds. Set to null to disable individual checks.
  # ---------------------------------------------------------------------------
  quality_gate:
    max_val_mae: 8.0        # minutes; reject if validation MAE > 8 min
    min_val_r2: 0.30        # reject if validation R² < 0.50

  # ---------------------------------------------------------------------------
  # Trip distance bounds (must match API schemas.py constants)
  # ---------------------------------------------------------------------------
  trip_distance_min: 0.0    # exclusive lower bound (miles)
  trip_distance_max: 100.0  # inclusive upper bound (miles)

  # ---------------------------------------------------------------------------
  # Real-time Drift Detection PSI Thresholds
  # ---------------------------------------------------------------------------
  drift_warning_threshold: 0.10   # PSI threshold for MEDIUM drift warning
  drift_alert_threshold: 0.20     # PSI threshold for HIGH drift alert