name: fleetsense

build: null

push: null

pull:
  # For remote worker pools (Docker/Kubernetes/Cloud): clone repo and cd to root
  # - prefect.deployments.steps.git_clone:
  #     repository: "https://github.com/your-org/FleetSense-Platform.git"
  #     branch: "main"
  - prefect.deployments.steps.set_working_directory:
      directory: .

deployments:
  - name: etl-monthly
    entrypoint: src/fleetsense/workflows/etl.py:etl_flow
    schedules:
      - cron: "0 2 1 * *"
        timezone: "Asia/Kolkata"
    parameters:
      trigger_training: true
    work_pool:
      name: fleetsense-pool

  - name: train-weekly
    entrypoint: src/fleetsense/workflows/train.py:train_flow
    schedules:
      - cron: "0 4 * * 0"
        timezone: "Asia/Kolkata"
    work_pool:
      name: fleetsense-pool