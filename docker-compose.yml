services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetsense-api
    ports:
      - "8000:8000"
    environment:
      - FLEETSENSE_APP_ENV=${FLEETSENSE_APP_ENV:-development}
      - FLEETSENSE_STORAGE_BACKEND=${STORAGE_BACKEND:-${FLEETSENSE_STORAGE_BACKEND:-local}}
      - FLEETSENSE_STORAGE_LOCAL_ROOT=${LOCAL_DATA_DIR:-/app/data}
      - FLEETSENSE_MODEL_ARTIFACT_PATH=${FLEETSENSE_MODEL_ARTIFACT_PATH:-/app/artifacts/models/latest_model.joblib}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME:-${AZURE_CONTAINER_NAME:-fleetsense-production}}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-}
      - ALLOW_SQLITE_TRACKING=${ALLOW_SQLITE_TRACKING:-true}
      - FLEETSENSE_METRICS_API_KEY=${FLEETSENSE_METRICS_API_KEY:-${METRICS_API_KEY:-}}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fleetsense-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: fleetsense-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    links:
      - api:fleetsense-api
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.3
    container_name: fleetsense-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://fleetsense-prometheus:9090}
    volumes:
      - ./deploy/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    links:
      - prometheus:fleetsense-prometheus
    depends_on:
      - prometheus
    restart: unless-stopped
