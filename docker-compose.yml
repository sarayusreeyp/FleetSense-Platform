version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetsense-api
    ports:
      - "8000:8000"
    environment:
      - FLEETSENSE_APP_ENV=${FLEETSENSE_APP_ENV:-development}
      - FLEETSENSE_STORAGE_BACKEND=local
      - FLEETSENSE_STORAGE_LOCAL_ROOT=/app/data
      - FLEETSENSE_MODEL_ARTIFACT_PATH=/app/artifacts/models/latest_model.joblib
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_MODEL_NAME=trip_duration_regressor
      - MLFLOW_MODEL_ALIAS=champion
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    depends_on:
      - mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: fleetsense-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.3
    container_name: fleetsense-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: fleetsense-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - POSTGRES_DB=mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.0
    container_name: fleetsense-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
    volumes:
      - ./artifacts/mlruns:/mlflow/artifacts
      - ./metadata:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetsense-prefect-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FLEETSENSE_APP_ENV=${FLEETSENSE_APP_ENV:-development}
      - FLEETSENSE_STORAGE_BACKEND=local
      - FLEETSENSE_STORAGE_LOCAL_ROOT=/app/data
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PREFECT_API_URL=${PREFECT_API_URL:-http://host.docker.internal:4200/api}
      - PREFECT_API_KEY=${PREFECT_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ./configs:/app/configs
    command: prefect worker start --pool fleetsense-pool --type process
    depends_on:
      - api
      - mlflow
    restart: unless-stopped

volumes:
  postgres_data:

