global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "fleetsense-api"
    metrics_path: "/metrics"
    # If FLEETSENSE_METRICS_API_KEY is configured on the API, mount or supply bearer_token
    # bearer_token: "${FLEETSENSE_METRICS_API_KEY}"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "fleetsense-inference-service"
          environment: "production"
