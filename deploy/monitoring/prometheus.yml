global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "fleetsense-api"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["fleetsense-api:8000", "fleetsense-api:80"]
        labels:
          service: "fleetsense-inference-service"
          environment: "production"
